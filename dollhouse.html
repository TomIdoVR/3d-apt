<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Room — 3D Floor Plan</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#e9ebef;height:100%}
  canvas{display:block}
  #hud{position:fixed;left:18px;bottom:16px;color:#5a6372;font:12px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       letter-spacing:.04em;opacity:.9;pointer-events:none}
  #hud b{color:#2563eb;font-weight:600}
  #title{position:fixed;left:18px;top:16px;color:#1f2733;font:600 15px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       letter-spacing:.12em;pointer-events:none}
  #title span{display:block;font-weight:400;font-size:10px;color:#7a8494;letter-spacing:.22em;margin-top:2px}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="title">GAME ROOM — 3D FLOOR PLAN<span>GYM · BAR · LOUNGE · PING PONG · ARCADE · POOL</span></div>
<div id="hud"><b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> zoom &nbsp;·&nbsp; auto-tour resumes when idle</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============ renderer / scene / camera ============ */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const c = document.createElement('canvas'); c.width = 8; c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'#f4f6f9'); gr.addColorStop(.55,'#e6e9ee'); gr.addColorStop(1,'#cfd4dc');
  g.fillStyle = gr; g.fillRect(0,0,8,256);
  const bgTex = new THREE.CanvasTexture(c); bgTex.colorSpace = THREE.SRGBColorSpace;
  scene.background = bgTex;
}

const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 120);
camera.position.set(16, 12.5, 15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.4, 0.2, -0.8);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 38;
controls.minPolarAngle = Math.PI * 0.08;
controls.maxPolarAngle = Math.PI * 0.46;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
let idleT = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; idleT = 0; });

/* image-based environment for realistic reflections */
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.15, 0.3, 0.985);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* ============ helpers ============ */
const TAU = Math.PI*2;
const updates = [];
const tick = f => updates.push(f);
const mat = o => new THREE.MeshStandardMaterial(o);
const box = (w,h,d,m) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
const rbox = (w,h,d,m,r=0.04) => new THREE.Mesh(new RoundedBoxGeometry(w,h,d,4,r), m);
const cyl = (rt,rb,h,m,s=24) => new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s), m);
const sph = (r,m,s=20) => new THREE.Mesh(new THREE.SphereGeometry(r,s,Math.max(10,s/2)), m);
function put(parent, mesh, x,y,z, ry=0){ mesh.position.set(x,y,z); mesh.rotation.y = ry; parent.add(mesh); return mesh; }
function shadows(g, cast=true, recv=true){ g.traverse(o=>{ if(o.isMesh){ o.castShadow=cast; o.receiveShadow=recv; }}); return g; }
function ctex(w,h,draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

/* room: x -9..9 (left→right), z -6..6 (back→front)
   door on BACK wall, media wall 90° to its right = RIGHT wall (x=+9) */
const RW=18, RD=12, WH=2.9, WT=0.2;

/* ============ dollhouse shell ============ */
const shellM = mat({ color:0xf3f4f6, roughness:.85 });
const innerM = mat({ color:0xc9c3b8, roughness:.92 });
const accentM = mat({ color:0x191920, roughness:.8 });
const capM   = mat({ color:0xfafafc, roughness:.6 });

{ const slab = box(RW+0.9, 0.5, RD+0.9, shellM); put(scene, slab, 0, -0.25, 0); slab.receiveShadow = true; }

/* walnut plank floor */
const woodTex = ctex(1024,1024,(g)=>{
  g.fillStyle='#5f4632'; g.fillRect(0,0,1024,1024);
  const tones=['#6b4f38','#5a412e','#74573e','#634934','#553d2b','#6f5239'];
  for(let r=0;r<16;r++) for(let cx=-1;cx<6;cx++){
    const off=(r%2)*96;
    g.fillStyle=tones[(r*5+cx+11)%6];
    g.fillRect(cx*192+off+1, r*64+1, 190, 62);
    g.strokeStyle='rgba(20,10,5,.5)'; g.strokeRect(cx*192+off+.5, r*64+.5, 191, 63);
    g.globalAlpha=.1; g.fillStyle='#fff';
    for(let s=0;s<6;s++) g.fillRect(cx*192+off+Math.random()*180, r*64+Math.random()*60, 30, 1);
    g.globalAlpha=1;
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(3,2);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW,RD), mat({ map:woodTex, roughness:.38, metalness:.05, envMapIntensity:.7 }));
floor.rotation.x = -Math.PI/2; floor.position.y = 0.005; floor.receiveShadow = true;
scene.add(floor);

function wallBox(w,h,d, x,y,z, m=shellM){
  const b = box(w,h,d,m); put(scene,b,x,y,z);
  b.castShadow = b.receiveShadow = true; return b;
}
function cap(w,d,x,z,y=WH){ const c = box(w,0.12,d,capM); put(scene,c,x,y+0.06,z); c.castShadow=true; }
function baseboard(w,d,x,z){ const b = box(w,0.12,d,capM); put(scene,b,x,0.06,z); }

/* back wall (z=-6) with sliding-door opening x -3.5..-0.5 */
wallBox(5.5, WH, WT, -6.25, WH/2, -6-WT/2);
wallBox(3.0, WH-2.45, WT, -2.0, 2.45+(WH-2.45)/2, -6-WT/2);
wallBox(9.5, WH, WT, 4.25, WH/2, -6-WT/2);
cap(RW+0.4, WT+0.12, 0, -6-WT/2);
{ const p = new THREE.Mesh(new THREE.PlaneGeometry(5.5, WH), innerM);
  put(scene, p, -6.25, WH/2, -5.992); p.receiveShadow = true; }
{ const p = new THREE.Mesh(new THREE.PlaneGeometry(9.5, WH), innerM);
  put(scene, p, 4.25, WH/2, -5.992); p.receiveShadow = true; }
baseboard(5.5, 0.05, -6.25, -5.95);
baseboard(9.5, 0.05, 4.25, -5.95);

/* left wall (x=-9) */
wallBox(WT, WH, RD+WT*2, -9-WT/2, WH/2, 0);
cap(WT+0.12, RD+0.6, -9-WT/2, 0);
{ const p = new THREE.Mesh(new THREE.PlaneGeometry(RD, WH), innerM);
  p.rotation.y = Math.PI/2; p.position.set(-8.992, WH/2, 0); scene.add(p); p.receiveShadow = true; }
{ const b = box(0.05,0.12,RD,capM); put(scene,b,-8.96,0.06,0); }

/* RIGHT wall (x=+9): the dark media accent wall, 90° to the door */
wallBox(WT, WH, RD+WT*2, 9+WT/2, WH/2, 0);
cap(WT+0.12, RD+0.6, 9+WT/2, 0);
{ /* dark panel z -6..4, light strip z 4..6 */
  const p = new THREE.Mesh(new THREE.PlaneGeometry(10, WH), accentM);
  p.rotation.y = -Math.PI/2; p.position.set(8.992, WH/2, -1); scene.add(p); p.receiveShadow = true;
  const p2 = new THREE.Mesh(new THREE.PlaneGeometry(2, WH), innerM);
  p2.rotation.y = -Math.PI/2; p2.position.set(8.992, WH/2, 5); scene.add(p2); p2.receiveShadow = true;
}

/* front wall: low cutaway (z=6) */
wallBox(RW, 0.85, WT, 0, 0.425, 6+WT/2);
cap(RW+0.4, WT+0.12, 0, 6+WT/2, 0.85);

/* white support column */
{
  const col = box(0.45, WH, 0.45, mat({ color:0xe8e4dc, roughness:.85 }));
  put(scene, col, -2.4, WH/2, -2.0); col.castShadow = col.receiveShadow = true;
  cap(0.55, 0.55, -2.4, -2.0);
}

/* ============ patio + pool behind the glass doors ============ */
{
  const slab = box(8.5, 0.5, 5.4, shellM);
  put(scene, slab, -2, -0.25, -8.8); slab.receiveShadow = true;
  const stone = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 5.4), mat({ color:0xd9d3c5, roughness:.95 }));
  stone.rotation.x = -Math.PI/2; put(scene, stone, -2, 0.006, -8.8); stone.receiveShadow = true;
  const lip = box(4.9, 0.07, 2.9, mat({ color:0xefede2, roughness:.8 }));
  put(scene, lip, -2.2, 0.035, -9.1); lip.receiveShadow = true;
  const poolTex = ctex(256,160,(g)=>{
    g.fillStyle='#2f9fd8'; g.fillRect(0,0,256,160);
    g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=2;
    for(let i=0;i<20;i++){ const y=Math.random()*160, x=Math.random()*256;
      g.beginPath(); g.moveTo(x,y); g.bezierCurveTo(x+20,y-12,x+40,y+12,x+60,y); g.stroke(); }
  });
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 2.5), mat({ map:poolTex, roughness:.08, envMapIntensity:1.2 }));
  pool.rotation.x = -Math.PI/2; put(scene, pool, -2.2, 0.075, -9.1);
  tick(t => { pool.material.color.setHSL(0.56, 0.55, 0.62 + 0.05*Math.sin(t*1.6)); });
  /* chrome ladder */
  {
    const chrome = mat({ color:0xdfe3e8, metalness:.95, roughness:.15 });
    const lad = new THREE.Group();
    for(const s of [-0.18, 0.18]) put(lad, cyl(0.022,0.022,0.55, chrome), s, 0.28, 0);
    for(const hy of [0.18, 0.38]) put(lad, cyl(0.016,0.016,0.36, chrome), 0, hy, 0).rotation.z = Math.PI/2;
    put(scene, lad, -0.25, 0, -8.45);
  }
  /* pink float ring */
  {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.13, 14, 28), mat({ color:0xf2647c, roughness:.5 }));
    ring.rotation.x = -Math.PI/2; put(scene, ring, -3.1, 0.14, -9.4);
  }
  for(const [bx,bz,s] of [[-5.7,-10.6,0.5],[-5.0,-10.9,0.4],[1.4,-10.7,0.5],[2.0,-10.3,0.35]]){
    const b = sph(s, mat({ color:0x4c7a40, roughness:.95 }), 12);
    put(scene, b, bx, s*0.8, bz); b.castShadow = true;
  }
  const lounge = new THREE.Group();
  put(lounge, box(0.55, 0.07, 1.5, mat({ color:0xeae2cf, roughness:.8 })), 0, 0.22, 0);
  const back = box(0.55, 0.07, 0.5, mat({ color:0xeae2cf, roughness:.8 }));
  back.rotation.x = -0.7; put(lounge, back, 0, 0.36, -0.85);
  for(const [lx,lz] of [[-0.2,-0.5],[0.2,-0.5],[-0.2,0.5],[0.2,0.5]])
    put(lounge, box(0.05,0.2,0.05, mat({color:0x8a8478})), lx, 0.1, lz);
  put(scene, shadows(lounge), 0.9, 0, -9.6, 0.5);
}

/* ============ sliding glass doors + curtains ============ */
{
  const frameM = mat({ color:0x2a2a2e, roughness:.4, metalness:.6 });
  put(scene, box(3.1,0.08,0.1,frameM), -2, 2.42, -6);
  put(scene, box(0.08,2.45,0.1,frameM), -3.52, 1.22, -6);
  put(scene, box(0.08,2.45,0.1,frameM), -0.48, 1.22, -6);
  const glassM = new THREE.MeshPhysicalMaterial({ color:0xcfe2ea, roughness:.04, metalness:0, transparent:true, opacity:0.16, envMapIntensity:1.4 });
  for(const [x,zo] of [[-2.74,0.02],[-1.26,-0.02]]){
    const g = new THREE.Group();
    put(g, box(1.46,2.3,0.04, glassM), 0,0,0);
    const e = mat({color:0x33333a,roughness:.45,metalness:.5});
    put(g, box(1.46,0.06,0.06,e),0, 1.16,0); put(g, box(1.46,0.06,0.06,e),0,-1.16,0);
    put(g, box(0.06,2.3,0.06,e),-0.71,0,0);  put(g, box(0.06,2.3,0.06,e), 0.71,0,0);
    put(scene, g, x, 1.22, -6+zo);
  }
  const curtM = mat({ color:0xf6f3ec, roughness:1, side:THREE.DoubleSide });
  const curtains = [];
  for(const x of [-3.42, -0.58]){
    const c = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 2.42, 16, 1), curtM);
    c.castShadow = true; put(scene, c, x, 1.25, -5.8); curtains.push(c);
  }
  tick(t => curtains.forEach((c,i)=>{
    const p = c.geometry.attributes.position;
    for(let v=0; v<p.count; v++){
      const x = p.getX(v);
      p.setZ(v, Math.sin(x*9 + t*1.1 + i*2)*0.05 + Math.sin(x*4 - t*0.6)*0.03);
    }
    p.needsUpdate = true;
  }));
}

/* framed photos on back-left wall */
[[-7.6, 2.0],[-6.4, 2.1],[-4.6, 1.95]].forEach(([x,y],i)=>{
  const f = new THREE.Group();
  put(f, box(0.62,0.82,0.05, mat({color:0x222226, roughness:.6})), 0,0,0);
  const art = ctex(64,86,(g)=>{ g.fillStyle=['#5a6670','#6e6354','#56707e'][i]; g.fillRect(0,0,64,86);
    g.fillStyle='rgba(255,255,255,.3)';
    for(let k=0;k<5;k++) g.fillRect(Math.random()*50, Math.random()*70, 14, 10); });
  put(f, new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.7), new THREE.MeshBasicMaterial({map:art})), 0,0,0.03);
  put(scene, f, x, y, -5.94); f.castShadow = true;
});

/* ============ MEDIA WALL on the RIGHT (x=+9), facing the room ============ */
const ledColor = new THREE.Color(0x3b5bff);
const ledMats = [], ledLights = [];

/* TV — centered on the right wall, facing left */
{
  const tv = new THREE.Group();
  put(tv, box(3.55, 2.05, 0.09, mat({ color:0x0a0a0d, roughness:.3, metalness:.4 })), 0, 0, 0);
  const sc = document.createElement('canvas'); sc.width = 768; sc.height = 432;
  const sg = sc.getContext('2d');
  const scTex = new THREE.CanvasTexture(sc); scTex.colorSpace = THREE.SRGBColorSpace;
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(3.38, 1.88), new THREE.MeshBasicMaterial({ map:scTex }));
  put(tv, screen, 0, 0, 0.05);
  put(scene, tv, 8.88, 1.85, -1, -Math.PI/2); tv.castShadow = true;
  tick(t => {
    const W=768, H=432;
    const bg = sg.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#04122e'); bg.addColorStop(.55,'#0a2a66'); bg.addColorStop(1,'#041028');
    sg.fillStyle = bg; sg.fillRect(0,0,W,H);
    sg.globalAlpha = 0.55;
    for(let k=0;k<3;k++){
      sg.beginPath(); sg.moveTo(0, H*0.55 + k*26);
      for(let x=0; x<=W; x+=16)
        sg.lineTo(x, H*0.52 + k*24 + Math.sin(x*0.012 + t*(0.7+k*0.25) + k*2)*36 + Math.sin(x*0.004 - t*0.4)*22);
      sg.lineTo(W,H); sg.lineTo(0,H); sg.closePath();
      sg.fillStyle = ['rgba(90,150,255,.30)','rgba(120,190,255,.22)','rgba(60,110,230,.25)'][k];
      sg.fill();
    }
    sg.globalAlpha = 1;
    sg.fillStyle = '#eaf2ff'; sg.font = '600 64px -apple-system, Segoe UI, sans-serif';
    sg.textAlign='center'; sg.textBaseline='middle';
    sg.shadowColor = '#7db4ff'; sg.shadowBlur = 26;
    sg.fillText('⊿ PS5', W/2, H*0.40);
    sg.shadowBlur = 0;
    for(let i=0;i<6;i++){
      sg.fillStyle = ['#27406e','#2e3550','#374a72','#27406e','#2e3550','#374a72'][i];
      sg.beginPath(); sg.roundRect(70 + i*108, H-86, 88, 56, 8); sg.fill();
    }
    sg.strokeStyle = '#8fb6ff'; sg.lineWidth = 3;
    sg.beginPath(); sg.roundRect(70 + (Math.floor(t)%6)*108, H-86, 88, 56, 8); sg.stroke();
    scTex.needsUpdate = true;
  });
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(3.95, 2.45), new THREE.MeshBasicMaterial({ color: ledColor.clone() }));
  put(scene, halo, 8.96, 1.85, -1, -Math.PI/2); ledMats.push(halo.material);
  const tvLight = new THREE.PointLight(0x3b5bff, 10, 6, 1.8);
  tvLight.position.set(8.2, 1.9, -1); scene.add(tvLight); ledLights.push(tvLight);
}

/* media console along the right wall + PS5 + decor */
{
  const cons = new THREE.Group();
  put(cons, rbox(5.4, 0.42, 0.5, mat({ color:0x1c1c20, roughness:.45 }), 0.02), 0, 0.42, 0);
  put(cons, box(5.4, 0.03, 0.5, mat({ color:0x0e0e11, roughness:.3, metalness:.3 })), 0, 0.645, 0);
  for(const lx of [-2.55, -0.85, 0.85, 2.55]) put(cons, box(0.05,0.21,0.4, mat({color:0x101010})), lx, 0.105, 0);
  for(const sx of [-1.35, 0, 1.35]) put(cons, box(0.012, 0.36, 0.51, mat({color:0x000000})), sx, 0.42, 0);
  const strip = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.03, 0.04), new THREE.MeshBasicMaterial({ color: ledColor.clone() }));
  put(cons, strip, 0, 0.205, 0.25); ledMats.push(strip.material);
  const ps5 = new THREE.Group();
  put(ps5, box(0.045, 0.36, 0.26, mat({ color:0x111116, roughness:.4 })), 0, 0.18, 0);
  put(ps5, box(0.02, 0.38, 0.28, mat({ color:0xf6f6f8, roughness:.3 })), -0.035, 0.19, 0);
  put(ps5, box(0.02, 0.38, 0.28, mat({ color:0xf6f6f8, roughness:.3 })),  0.035, 0.19, 0);
  put(cons, ps5, -1.6, 0.66, 0, 0.3);
  const potM = mat({ color:0xe2ded4, roughness:.8 });
  for(const px of [-0.5, 2.2]){
    const p = new THREE.Group();
    put(p, cyl(0.06,0.05,0.1, potM), 0, 0.05, 0);
    put(p, sph(0.07, mat({ color:0x4a7a3a, roughness:.9 }), 10), 0, 0.16, 0);
    put(cons, p, px, 0.66, 0);
  }
  put(cons, box(1.1, 0.07, 0.1, mat({ color:0x222228, roughness:.5 })), 0.7, 0.7, 0.05);
  put(scene, shadows(cons), 8.62, 0, -1, -Math.PI/2);
  const underL = new THREE.PointLight(0x3b5bff, 4, 2.5, 2);
  underL.position.set(8.2, 0.22, -1); scene.add(underL); ledLights.push(underL);
}

/* framed jerseys flanking the TV on the right wall */
function jersey(z, body, trim, name, num, nameCol){
  const g = new THREE.Group();
  put(g, box(0.78, 0.98, 0.06, mat({ color:0x17171a, roughness:.55 })), 0, 0, 0);
  const tex = ctex(160, 200, (c)=>{
    c.fillStyle = '#202024'; c.fillRect(0,0,160,200);
    c.fillStyle = body;
    c.beginPath();
    c.moveTo(34,28); c.lineTo(64,16); c.quadraticCurveTo(80,30,96,16); c.lineTo(126,28);
    c.lineTo(140,70); c.lineTo(118,78); c.lineTo(120,186); c.lineTo(40,186); c.lineTo(42,78); c.lineTo(20,70);
    c.closePath(); c.fill();
    c.strokeStyle = trim; c.lineWidth = 5; c.stroke();
    c.fillStyle = nameCol; c.textAlign = 'center';
    c.font = '700 17px sans-serif'; c.fillText(name, 80, 78);
    c.font = '800 56px sans-serif'; c.fillText(num, 80, 140);
  });
  put(g, new THREE.Mesh(new THREE.PlaneGeometry(0.66, 0.86), new THREE.MeshBasicMaterial({ map:tex })), 0, 0, 0.035);
  put(scene, g, 8.92, 2.0, z, -Math.PI/2); g.castShadow = true;
}
jersey(-3.55, '#1a1a20', '#c0392b', 'JORDAN', '23', '#e74c3c');
jersey(1.9, '#1d4fa0', '#f1c40f', 'CURRY', '30', '#f7d34c');

/* mini beverage fridge near the media wall */
{
  const f = new THREE.Group();
  put(f, rbox(0.52, 0.85, 0.5, mat({ color:0x1a1a1e, roughness:.45 }), 0.02), 0, 0.425, 0);

      const arm = cyl(0.026, 0.026, 0.6, armM);
      arm.rotation.x = Math.PI/2; arm.rotation.z = s*0.12;
      put(tonal, arm, s*0.42, 1.42, 0.36);
      const elbow = sph(0.04, armM, 12); put(tonal, elbow, s*0.45, 1.4, 0.66);
      const grip = cyl(0.022, 0.022, 0.16, mat({ color:0x3a3a40, roughness:.8 }));
      grip.rotation.z = Math.PI/2; put(tonal, grip, s*0.45, 1.26, 0.7);
      const cable = cyl(0.006, 0.006, 0.13, mat({ color:0x0a0a0a }));
      put(tonal, cable, s*0.45, 1.33, 0.68);
    }
    put(scene, shadows(tonal), -8.94, 0, -1.0, Math.PI/2);
    /* workout bench facing the Tonal */
    const bench = new THREE.Group();
    put(bench, rbox(1.1, 0.1, 0.34, mat({ color:0x1c1c20, roughness:.7 }), 0.03), 0, 0.45, 0);
    put(bench, box(0.08, 0.4, 0.3, rm), -0.42, 0.2, 0);
    put(bench, box(0.08, 0.4, 0.3, rm),  0.42, 0.2, 0);
    put(scene, shadows(bench), -7.6, 0, -1.0);
    /* small workout mat under the Tonal zone */
    const tmat = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.8), mat({ color:0x34343a, roughness:1 }));
    tmat.rotation.x = -Math.PI/2; tmat.position.set(-7.9, 0.013, -1.0); tmat.receiveShadow = true;
    scene.add(tmat);
  }

  const dr = new THREE.Group();
  put(dr, box(0.9, 0.05, 0.3, rm), 0, 0.35, 0);
  put(dr, box(0.05, 0.35, 0.3, rm), -0.43, 0.17, 0);
  put(dr, box(0.05, 0.35, 0.3, rm),  0.43, 0.17, 0);
  for(let i=0;i<4;i++){
    const db = new THREE.Group();
    for(const s of [-0.07, 0.07]){
      const hsp = sph(0.045, mat({ color:0x32323a, roughness:.35, metalness:.4 }), 10); hsp.position.x = s; db.add(hsp);
    }
    const hd = cyl(0.015,0.015,0.1, mat({color:0x777}));
    hd.rotation.z = Math.PI/2; db.add(hd);
    db.position.set(-0.32 + i*0.21, 0.43, 0); dr.add(db);
  }
  put(scene, shadows(dr), -8.55, 0, -2.2, Math.PI/2);
}

/* ============ studio lighting ============ */
renderer.toneMappingExposure = 1.12;
scene.add(new THREE.AmbientLight(0xf4f0ff, 0.28));
scene.add(new THREE.HemisphereLight(0xdfe8f4, 0xc4b094, 0.75));
{
  /* warm key — late-afternoon sun angle */
  const key = new THREE.DirectionalLight(0xffeacd, 3.1);
  key.position.set(12, 18, 14);
  key.castShadow = true;
  key.shadow.mapSize.set(4096, 4096);
  key.shadow.camera.left = -16; key.shadow.camera.right = 16;
  key.shadow.camera.top = 16;   key.shadow.camera.bottom = -16;
  key.shadow.camera.far = 60;
  key.shadow.bias = -0.0008;
  key.shadow.normalBias = 0.025;
  scene.add(key);
  /* cool sky fill from the opposite side */
  const fill = new THREE.DirectionalLight(0xcfdcf2, 0.55);
  fill.position.set(-14, 9, -6);
  scene.add(fill);
  /* rim light from behind for depth on furniture edges */
  const rim = new THREE.DirectionalLight(0xbfd0ff, 0.5);
  rim.position.set(-5, 12, -16);
  scene.add(rim);
}

/* LED blue↔purple breathing */
tick(t => {
  const hue = 0.64 + 0.075 * (0.5 + 0.5*Math.sin(t*0.45));
  ledColor.setHSL(hue, 1.0, 0.6);
  for(const m of ledMats) m.color.copy(ledColor);
  for(const l of ledLights) l.color.copy(ledColor);
});

window.__three = { camera, controls };

/* ============ main loop ============ */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const t = clock.getElapsedTime();
  idleT += 1/60;
  if(!controls.autoRotate && idleT > 8) controls.autoRotate = true;
  for(const f of updates) f(t);
  controls.update();
  composer.render();
}
loop();
</script>
